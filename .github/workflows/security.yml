name: security

# Pins, secrets, and production advisories.
# Runtime floor: Node 22.23.4 / 24.22.1 / 26.12.1 and Bun 1.4.4.
# Production audit fails on critical. High findings are reported and do not fail the job.

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject EOL or floating Node and Bun pins
        run: bash .github/scripts/check-runtime-pins.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan working tree
        run: |
          if [ -f .gitleaks.toml ]; then
            gitleaks dir . --redact --verbose --config .gitleaks.toml
          else
            gitleaks dir . --redact --verbose
          fi

  prod-audit:
    name: prod audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dir: "."
            pm: npm
            pnpm: ""
            lock: package-lock.json
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: matrix.pm == 'pnpm'
        with:
          version: ${{ matrix.pnpm }}

      - uses: actions/setup-node@v4
        if: matrix.pm != 'bun'
        with:
          node-version: "22.23.4"
          cache: ${{ matrix.pm }}
          cache-dependency-path: ${{ matrix.lock }}

      - uses: oven-sh/setup-bun@v2
        if: matrix.pm == 'bun'
        with:
          bun-version: "1.4.4"

      - name: Install from the lockfile
        working-directory: ${{ matrix.dir }}
        run: |
          case "${{ matrix.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            npm) npm ci ;;
            yarn) yarn install --frozen-lockfile ;;
            bun) bun install --frozen-lockfile ;;
          esac

      - name: Fail on critical production advisories
        working-directory: ${{ matrix.dir }}
        run: |
          case "${{ matrix.pm }}" in
            pnpm) pnpm audit --prod --audit-level critical ;;
            npm) npm audit --omit=dev --audit-level=critical ;;
            yarn) yarn audit --groups dependencies --level critical ;;
            bun) bun audit --audit-level=critical ;;
          esac

      - name: Report high production advisories
        if: success()
        continue-on-error: true
        working-directory: ${{ matrix.dir }}
        run: |
          case "${{ matrix.pm }}" in
            pnpm) pnpm audit --prod --audit-level high ;;
            npm) npm audit --omit=dev --audit-level=high ;;
            yarn) yarn audit --groups dependencies --level high ;;
            bun) bun audit --audit-level=high ;;
          esac
